app-id: io.github.odioski.ceedee_ripper
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm21
  - org.freedesktop.Sdk.Extension.rust-stable
command: ceedee-ripper

finish-args:
  - "--share=ipc"
  - "--socket=fallback-x11"
  - "--socket=wayland"
  - "--share=network"
  - "--device=all"
  - "--filesystem=/dev/cdrom"
  - "--filesystem=/dev/sr0"
  - "--filesystem=/dev/sr1"
  - "--filesystem=/run/udev:ro"
  - "--filesystem=xdg-music:create"
  - "--filesystem=/media"
  - "--filesystem=/run/media"
  - "--system-talk-name=org.freedesktop.UDisks2"

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
  - /share/aclocal
  - /share/doc
  - /share/gtk-doc
  - /share/info
  - /share/man
  - "*.a"
  - "*.la"

modules:
  - name: libdiscid
    buildsystem: autotools
    sources:
      - type: archive
        url: https://ftp.musicbrainz.org/pub/musicbrainz/libdiscid/libdiscid-0.6.4.tar.gz
        sha256: dd5e8f1c9aead442e23b749a9cc9336372e62e88ad7079a2b62895b0390cb282

  - name: ceedee-ripper
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm21/bin
      env:
        CARGO_HOME: /run/build/ceedee-ripper/cargo
        LIBRARY_PATH: /app/lib
        LD_LIBRARY_PATH: /app/lib
        LIBCLANG_PATH: /usr/lib/sdk/llvm21/lib
        PKG_CONFIG_PATH: /app/lib/pkgconfig
    build-commands:
      - mkdir -p .cargo
      - |
        printf '%s\n' \
          '[source.crates-io]' \
          'replace-with = "vendored-sources"' \
          '' \
          '[source.vendored-sources]' \
          'directory = "cargo/vendor"' \
          > .cargo/config.toml
      - cargo build --release --locked --offline --features "gtk-ui egui-ui"
      - install -Dm755 target/release/ceedee-ripper /app/bin/ceedee-ripper
      - install -Dm644 resources/ceedee-ripper.desktop /app/share/applications/io.github.odioski.ceedee_ripper.desktop
      - install -Dm644 resources/images/ceedee-ripper.png /app/share/icons/hicolor/256x256/apps/io.github.odioski.ceedee_ripper.png
      - install -Dm644 resources/metainfo/io.github.odioski.ceedee_ripper.metainfo.xml /app/share/metainfo/io.github.odioski.ceedee_ripper.metainfo.xml
      - sed -i 's#<launchable type="desktop-id">ceedee-ripper.desktop</launchable>#<launchable type="desktop-id">io.github.odioski.ceedee_ripper.desktop</launchable>#' /app/share/metainfo/io.github.odioski.ceedee_ripper.metainfo.xml
    sources:
      - generated-sources.json
      - type: dir
        path: ../..
        skip:
          - .git
          - .flatpak-builder
          - target
          - packaging/flatpak/.flatpak-builder
