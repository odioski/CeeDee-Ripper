[package]
name = "ceedee-ripper"
version = "1.1.0"
edition = "2021"
authors = ["Omar Daniels"]
license = "MIT"
description = "Linux desktop app for extracting audio CDs to FLAC, MP3, WAV, or Ogg Vorbis."
readme = "README.md"
homepage = "https://github.com/odioski/CeeDee-Ripper"
repository = "https://github.com/odioski/CeeDee-Ripper"
keywords = ["audio", "cd", "ripper", "music"]
categories = ["multimedia::audio"]

[features]
default = ["egui-ui"]
gtk-ui = ["dep:gtk4", "dep:libadwaita", "dep:libadwaita-sys"]
egui-ui = ["dep:eframe", "dep:egui", "dep:image"]

[package.metadata.deb]
section = "sound"
maintainer = "Omar Daniels"
copyright = "Copyright (c) 2026 Omar Daniels"
depends = "$auto, cdparanoia, cd-discid, eject, flac, lame, vorbis-tools, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-ugly, libdiscid0, libgstreamer1.0-0, libgstreamer-plugins-base1.0-0"
assets = [
    ["target/release/ceedee-ripper", "usr/bin/ceedee-ripper", "755"],
    ["resources/images/ceedee-ripper.png", "usr/share/icons/hicolor/256x256/apps/ceedee-ripper.png", "644"],
    ["resources/ceedee-ripper.desktop", "usr/share/applications/ceedee-ripper.desktop", "644"],
    ["resources/metainfo/io.github.odioski.ceedee_ripper.metainfo.xml", "usr/share/metainfo/io.github.odioski.ceedee_ripper.metainfo.xml", "644"],
]


[dependencies]
gtk4 = { version = "0.11.3", optional = true }
libadwaita = { version = "0.9.1", optional = true }
libadwaita-sys = { version = "0.9.1", optional = true }
eframe = { version = "0.34.2", optional = true }
egui = { version = "0.34.2", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
gstreamer = "0.25.1"
gstreamer-audio = "0.25.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"
discid = "0.5"
libc = "0.2"
ureq = { version = "2.9", features = ["json"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
glib = "0.22.6"
glib-2-0-sys = "0.46.4"

[build-dependencies]
glib-build-tools = "0.18.0"
