name: ceedee-ripper
base: core24
version: '1.1.0'
title: CeeDee Ripper
summary: Audio CD music ripper
description: |
  CeeDee Ripper detects audio CDs, looks up album metadata, and extracts
  selected tracks to FLAC, MP3, WAV, or Ogg Vorbis files.
license: MIT
contact: https://github.com/odioski/CeeDee-Ripper/issues
issues: https://github.com/odioski/CeeDee-Ripper/issues
source-code: https://github.com/odioski/CeeDee-Ripper
website: https://github.com/odioski/CeeDee-Ripper
donation: https://buymeacoffee.com/odioski


grade: stable
confinement: strict

apps:
  ceedee-ripper:
    command: usr/bin/ceedee-ripper
    desktop: usr/share/applications/ceedee-ripper.desktop
    plugs:
      - desktop
      - desktop-legacy
      - home
      - mount-observe
      - network
      - opengl
      - optical-drive
      - removable-media
      - wayland
      - x11

parts:
  ceedee-ripper:
    plugin: rust
    source: .
    build-packages:
      - libcairo2-dev
      - libadwaita-1-dev
      - libatk-bridge2.0-dev
      - libclang-dev
      - libdiscid-dev
      - libepoxy-dev
      - libgdk-pixbuf-2.0-dev
      - libglib2.0-dev
      - libgraphene-1.0-dev
      - libgstreamer-plugins-base1.0-dev
      - libgstreamer1.0-dev
      - libgtk-4-bin
      - libgtk-4-common
      - libgtk-4-dev
      - libpango1.0-dev
      - libvulkan-dev
      - libwayland-dev
      - libxkbcommon-dev
      - pkg-config
    stage-packages:
      - adwaita-icon-theme
      - cd-discid
      - cdparanoia
      - eject
      - flac
      - fontconfig
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-ugly
      - hicolor-icon-theme
      - lame
      - libadwaita-1-0
      - libatk-bridge2.0-0
      - libcairo2
      - libdiscid0
      - libepoxy0
      - libgdk-pixbuf-2.0-0
      - libglib2.0-0t64
      - libglib2.0-0
      - libglib2.0-dev
      - libgraphene-1.0-0
      - libgstreamer-plugins-base1.0-0
      - libgstreamer1.0-0
      - libgtk-4-1
      - libgtk-4-bin
      - libgtk-4-common
      - libpango-1.0-0
      - libpangocairo-1.0-0
      - libvulkan1
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libxkbcommon0
      - mesa-vulkan-drivers
      - shared-mime-info
      - vorbis-tools
    override-build: |
      cargo build --release --features "gtk-ui egui-ui"
      install -Dm755 target/release/ceedee-ripper "$CRAFT_PART_INSTALL/usr/bin/ceedee-ripper"
      install -Dm644 resources/ceedee-ripper.desktop "$CRAFT_PART_INSTALL/usr/share/applications/ceedee-ripper.desktop"
      install -Dm644 resources/images/ceedee-ripper.png "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps/io.github.odioski.ceedee_ripper.png"
      install -Dm644 resources/images/ceedee-ripper.png "$CRAFT_PART_INSTALL/usr/share/pixmaps/io.github.odioski.ceedee_ripper.png"
      install -Dm644 resources/metainfo/io.github.odioski.ceedee_ripper.metainfo.xml "$CRAFT_PART_INSTALL/usr/share/metainfo/io.github.odioski.ceedee_ripper.metainfo.xml"
